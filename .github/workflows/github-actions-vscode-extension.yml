name: VS Code Extension

on: [push, pull_request]

# Fork CI: build and test only. The upstream publish job (Marketplace + Open VSX) was removed —
# releases are packaged locally with build.ps1. macOS was dropped: its test runner failed with
# "spawn ... Electron ENOENT" on every master push.
jobs:
  ci:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@v6

      - name: 🏗 Set up NodeJS
        uses: actions/setup-node@v6.1.0
        with:
          node-version-file: ".nvmrc"

      - name: 🏗 Install NodeJS packages
        run: npm ci

      - name: 🚀 Run Linter
        run: npm run lint

      - name: 🚀 Build Schema
        run: npm run schema

      - name: 🚀 Run Compile
        run: npm run compile

      - name: 🧪 Run tests
        run: xvfb-run -a npm test
