  #   }


  #################################
  # CARD_MOD: ha-top-app-bar-fixed
  #################################
  card-mod-top-app-bar-fixed: |
    :host {
      --primary-background-color: #ffffffff;
    }
    header.mdc-top-app-bar.mdc-top-app-bar--fixed {
      {# Action Items menu in top right #}
      --mdc-shape-medium: 16px;
      --mdc-theme-on-surface: rgba(250, 250, 255, 0.95);
      --mdc-theme-text-primary-on-background: rgba(250, 250, 255, 0.95);
      --mdc-theme-surface: rgba(0, 5, 10, 0.8);
    }
    div.mdc-top-app-bar--fixed-adjust {
      --primary-background-color: rgba(30, 30, 30, 0.01);
    }

  #################################
  # CARD_MOD: ha-panel-developer-tools (~/developer-tools)
  #################################
  card-mod-developer-tools-yaml: |
    developer-yaml-config $ ha-card:nth-of-type(2) $: |
      :host slot {
        display: block;
        padding-top: 5px;
        overflow: auto;
        color: var(--warning-color);
        font-weight: 600;
      }
    developer-tools-router>developer-tools-state:
      $ha-expansion-panel$: |
        :host([outlined]) {
          box-shadow: var(--shadow-inset) !important;
          border-radius: 1.2rem;
          border: none;
        }
    "developer-tools-router > developer-tools-state $":
      "developer-tools-state-renderer $": |
        div>div.row.filters {
          box-shadow: var(--shadow-inset);
          --table-row-alternative-background-color: transparent;
          border-radius: 1.2rem;
          border: none;
        }
  #################################
  # CARD_MOD: ha-panel-custom (inc https://github.com/thomasloven/hass-browser_mod)
  #################################
  card-mod-panel-custom-yaml: |
    browser-mod-panel: |
      :host {
      }

  #################################
  # CARD_MOD: ha-panel-config (/config)
  #################################
  card-mod-config-yaml: |
    "* $": |
      ha-config-section {
        --card-background-color: transparent; /* used by     --md-sys-color-surface */
      }
      hass-tabs-subpage, hass-subpage {
        background-color: unset !important;
      }
      ha-sidebar {
        background-color: unset !important;
      }  
      :host hass-subpage div.container {
        gap: 5px;
      }
      :host hass-subpage div.container div.header div.actions ha-button {
        box-shadow: var(--shadow-raised);
        overflow: visible;
      }
      ha-outlined-field {
        box-shadow: var(--shadow-inset);
      }
      ha-config-entry-row {
        box-shadow: var(--shadow-outset);
        border-radius: var(--ha-card-border-radius);
      }
      ha-input-search {
        box-shadow: var(--shadow-inset);
        border-radius: var(--ha-card-border-radius);
      }
    "hass-tabs-subpage > ha-data-table $":
      "div > slot > div > search-input-outlined $":
        "ha-outlined-text-field $ span > ha-outlined-field $": |
          .outline {
              box-shadow: var(--shadow-inset);
            }
    .: |
      :host {
        {## Action Items menu in top right ##}
        --mdc-shape-medium: 16px;
        --mdc-theme-on-surface: rgba(250, 250, 255, 0.95);
        --mdc-theme-text-primary-on-background: rgba(250, 250, 255, 0.95);
        --mdc-theme-surface: rgba(0, 5, 10, 0.8);
        --md-list-container-color: transparent;
        --primary-background-color: transparent;
      }

  #################################
  # GLOBAL-MOD
  # https://github.com/alex3305/lovelace-global-mod
  #################################

  root-selector: ""
  root-style: |
    :host, * {
      --card-mod-theme: my_neumorphic;
      text-rendering: optimizeLegibility;
    }
    @media all and (max-width: 767px) {
      :host { max-width: 100%; overflow-x: hidden;}
    }
  root-style-light: |
    ::selection {
      text-shadow: none;
      color: hsl(0, 0%, 90%);
      background-color: hsl(290, 100%, 50%);
    }
  root-style-dark: |
    ::selection {
      text-shadow: none;
      color: hsl(0, 0%, 0%);
      background-color: hsl(290, 100%, 50%);
    }

  drawer-modal-selector: 'home-assistant-main$ha-drawer$'
  drawer-modal-style: |
    aside.mdc-drawer {
      box-shadow: var(--shadow-outset);
    }

  view-background-selector: ""
  view-background-style: |
    ha-drawer {
      background: var(--view-background);
    }
  view-background-style-light: |
    :host {
      --view-background: hsl(0, 0%, 90%);
      --primary-text-color: hsl(0, 0%, 10%);
    }
  view-background-style-dark: |
    :host {
      --view-background: var(--grey-1-color);
      --card-background-color: var(--grey-card-color);
      --background-color: var(--grey-1-color);
      --primary-color: hsl(280, 55%, 58%);
      --primary-light-color: hsl(290, 55%, 68%);
      --primary-dark-color: hsl(270, 55%, 48%);
    }

