my_neumorphic:
  # =============================================================================
  # FULL NEUMORPHIC THEME FOR HOME ASSISTANT
  # =============================================================================
  # A premium neumorphic (soft UI) theme with light and dark modes
  # Version: 1.0.0
  # Author: Lovable AI
  # License: MIT
  #
  # Features:
  # - Complete neumorphic design system with convex/concave shadows
  # - Premium typography (Segoe UI / system font stack)
  # - Full coverage of HA theme variables
  # - Optimized for readability and accessibility
  # - Works beautifully with Mushroom cards
  # =============================================================================

  #################################
  # TYPOGRAPHY SETTINGS
  #################################
  font-stack: "Figtree, Noto Color Emoji, -apple-system, BlinkMacSystemFont, Apple Color Emoji, sans-serif"
  mdc-typography-button-font-family: "var(--font-stack)"
  mdc-typography-font-family: "var(--font-stack)"

  ha-font-family-body: "var(--font-stack)"
  ha-font-family-heading: "var(--font-stack)"
  ha-font-family-code: "var(--font-stack)"
  ha-font-family-longform: "var(--font-stack)"

  ha-font-size-scale: "1"
  ha-font-size-xs: "calc(10px * var(--ha-font-size-scale))"
  ha-font-size-s: "calc(12px * var(--ha-font-size-scale))"
  ha-font-size-m: "calc(14px * var(--ha-font-size-scale))"
  ha-font-size-l: "calc(16px * var(--ha-font-size-scale))"
  ha-font-size-xl: "calc(20px * var(--ha-font-size-scale))"
  ha-font-size-2xl: "calc(24px * var(--ha-font-size-scale))"
  ha-font-size-3xl: "calc(28px * var(--ha-font-size-scale))"
  ha-font-size-4xl: "calc(32px * var(--ha-font-size-scale))"
  ha-font-size-5xl: "calc(40px * var(--ha-font-size-scale))"

  h1-font-size: "2rem"
  h2-font-size: "1.5rem"
  h3-font-size: "1.17rem"
  h4-font-size: "1rem"
  h5-font-size: "0.83rem"
  h6-font-size: "0.67rem"

  h1-font-weight: "100"
  h2-font-weight: "100"
  h3-font-weight: "100"
  h4-font-weight: "500"
  h5-font-weight: "400"
  h6-font-weight: "400"

  # Body at 14px = 10.5pt = 1rem
  body-font-size: "1rem"
  body-font-weight: "normal"
  body-line-height: "normal"
  card-title-font-size: "1.5rem"
  card-title-font-weight: "500"
  card-title-line-height: "normal"
  title-font-size: "2rem"
  subtitle-font-size: "1rem"
  small-font-size: "0.9rem"

  # Northern Line: black  
  mush-rgb-northern: "0, 0, 0"
  # Bakerloo Line: brown
  mush-rgb-bakerloo: "150, 100, 60"
  

  body-font: "var(--body-font-weight) var(--body-font-size) var(--font-stack)"
  card-title-font: "var(--card-title-font-weight) var(--card-title-font-size) var(--font-stack)"
  h1-font: "var(--h1-font-weight) var(--h1-font-size) var(--font-stack)"
  h2-font: "var(--h2-font-weight) var(--h2-font-size) var(--font-stack)"
  h3-font: "var(--h3-font-weight) var(--h3-font-size) var(--font-stack)"
  h4-font: "var(--h4-font-weight) var(--h4-font-size) var(--font-stack)"
  h5-font: "var(--h5-font-weight) var(--h5-font-size) var(--font-stack)"
  h6-font: "var(--h6-font-weight) var(--h6-font-size) var(--font-stack)"

  #################################
  # COLOR PALETTE REFERENCE
  # https://www.learnui.design/tools/data-color-picker.html
  #################################
  # 1f2937
  # 1d365b
  # 244280
  # 3c4aa4
  # 634ec4
  # 924cdf
  # c73ef3
  # ff00ff

  #################################
  # DIVERGENT COLOR SCALE
  # https://www.learnui.design/tools/data-color-picker.html
  #################################
  # 1f2937
  # 81868e
  # f1f1f1
  # ff9ef9
  # ff00ff

  #################################
  # CODEMIRROR COLORS
  #################################
  code-editor-gutter-color: "#061426"
  code-editor-background-color: "#00254b"
  markdown-code-background-color: "#00254b"
  codemirror-meta: "#ffcb6b"
  codemirror-property: "#ff8000"
  codemirror-string: "#3AD900"
  codemirror-atom: "#ffffff00"
  codemirror-keyword: "#FFEE80"
  codemirror-number: "#10a5dfff"
  codemirror-comment: "#036b0aff"

  #################################
  # MUSHROOM COLORS
  #################################
  mush-rgb-red: "244, 67, 54"
  mush-rgb-pink: "233, 30, 99"
  mush-rgb-purple: "156, 39, 176"
  mush-rgb-deep-purple: "103, 58, 183"
  mush-rgb-indigo: "63, 81, 181"
  mush-rgb-blue: "33, 150, 243"
  mush-rgb-light-blue: "3, 169, 244"
  mush-rgb-cyan: "0, 188, 212"
  mush-rgb-teal: "0, 150, 136"
  mush-rgb-green: "76, 175, 80"
  mush-rgb-light-green: "139, 195, 74"
  mush-rgb-lime: "205, 220, 57"
  mush-rgb-yellow: "255, 235, 59"
  mush-rgb-amber: "255, 193, 7"
  mush-rgb-orange: "255, 152, 0"
  mush-rgb-deep-orange: "255, 87, 34"
  mush-rgb-brown: "121, 85, 72"
  mush-rgb-grey: "158, 158, 158"
  mush-rgb-blue-grey: "96, 125, 139"
  mush-rgb-black: "0, 0, 0"
  mush-rgb-white: "255, 255, 255"
  mush-rgb-disabled: "200, 200, 200"

  mdc-theme-primary: "hsl(300, 100%, 50%)"
  colour-neon-green: "#39FF14"
  colour-neon-yellow: "#CCFF00"
  colour-neon-orange: "#FF5C00"
  colour-neon-red: "#FF3131"
  colour-neon-pink: "#FF1493"
  colour-neon-blue: "#00E5FF"

  # --- Sidebar ---
  md-list-item-leading-icon-size: "1.8rem"
  # sidebar_selected_icon_color: "var(--state-icon-active-color)"
  # sidebar_selected_text_color: "var(--state-icon-active-color)"
  #app-safe-area-inset-left: "-56px"

  # --- Layout Spacing ---
  masonry-view-card-margin: "4px 8px 4px 8px"
  grid-card-gap: "16px"
  stack-card-margin: "8px"
  horizontal-stack-card-margin: "0 8px"
  vertical-stack-card-margin: "8px 0"
  control-slider-border-radius: "1.2rem"
  control-slider-tooltip-font-size: "1.5rem"

  # --- Dialog Styling ---
  dialog-backdrop-filter: "blur(8px)"
  dialog-scrim-color: "hsla(0, 0%, 0%, 0.6)"
  dialog-z-index: "8"
  dialog-surface-top: "0"
  dialog-surface-margin-top: "0px"
  dialog-surface-backdrop-filter: "blur(8px)"
  ha-dialog-scrim-backdrop-filter: "blur(4px)"
  ha-dialog-max-width: "600px"
  ha-dialog-min-height: "auto"
  ha-dialog-border-radius: "25px"
  ha-card-border-radius: "1.2rem"
  ha-card-border: "0"
  ha-card-border-style: "solid"
  ha-card-border-width: "0"
  ha-button-height: "4rem"
  ha-button-border-radius: "1.2rem"
  ha-icon-button-size: "35px"
  wa-form-control-padding-inline: ".6rem 1.5rem"


  #################################
  # Navbar Card
  # https://joseluis9595.github.io/lovelace-navbar-card/docs/introduction
  #################################
  # navbar-primary-color: "var(--primary-color)"
  # navbar-border-radius: "1.2rem"
  # navbar-background-color: "var(--grey-1-color)"
  # navbar-route-icon-size: "2rem"
  # navbar-route-image-size: "2rem"
  navbar-box-shadow-desktop: "var(--shadow-outset)"
  navbar-box-shadow: "var(--shadow-outset)"
  navbar-box-shadow-mobile-floating: "var(--shadow-outset)"
  navbar-primary-color: "var(--primary-color)"
  navbar-background-color: "var(--ha-card-background)"
  navbar-route-icon-size: "2rem"
  navbar-route-image-size: "2rem"
  navbar-border-radius: "var(--ha-card-border-radius, 12px)"

  state-active-color: "var(--primary-color)"

  control-slider-thickness: "0.5rem"
  control-slider-background-opacity: "1"
  control-slider-background: "transparent"


  #################################
  # CARD_MOD: hui-root
  #################################

  # This can be commented out as GLOBAL-MOD is used in this theme and it is a requirement to
  # call the card-mod theme via the root selector in GLOBAL-MOD. If you are not using GLOBAL-MOD,
  # you can uncomment the line below to apply the theme to all card-mod elements.
  card-mod-theme: my_neumorphic

  card-mod-root-yaml: |
    .: |
      .toolbar > ha-tab-group {
        pointer-events: none;
        opacity: 0;
      }
      div.tab-bar {
        justify-content: center;
      }
      /* INPUTS */
      input, ha-textfield, ha-select {
        background: var(--ha-card-background) !important;
        /* variable above is valid and defined by another application */
        backdrop-filter: none !important;
        -webkit-backdrop-filter: none !important;
        border-radius: var(--ha-card-border-radius) !important;
        border: 0 !important;
        box-shadow: var(--shadow-inset) !important;
      }


  #################################
  # CARD_MOD: ha-card
  #################################
  card-mod-card-yaml: |
    .: |
      ha-card {
        transition: box-shadow 200ms ease, transform 180ms ease;
      }
      .card-header,
      .header,
      .section-header {
        text-shadow: 0 1px 0 hsla(0,0%,25%,0.7), 0 -1px 0 hsl(0,0%,5%);
        letter-spacing: 0.04em;
      }

  #################################
  # CARD_MOD: hui-view
  #################################
  card-mod-view: |
    #view {
      padding-top:
        {%- if browser == 'HA-FireTablet' or browser == 'iPhone 15 Pro Max' %}
          1px;
        {%- else -%}
          0px;
        {%- endif %}
    }
    #view.has-tab-bar {
      /* Drop the page in edit-mode */
      padding-top: 113px;
    }

  #################################
  # CARD_MOD: ha-row
  #################################
  card-mod-row-yaml: |
    "* $": |
      ha-config-section {
        --card-background-color: transparent ; /* used by     --md-sys-color-surface */
      }
    hui-generic-entity-row:
      $: |
        :host(:not([slot=secondary])) {
          box-shadow: none !important;
        }
        .secondary {
          box-shadow: none !important;
        }                  
    ha-select $: |
      :host(:not([disabled])) .mdc-select:not(.mdc-select--outlined):not(.mdc-select--disabled) .mdc-select__anchor,
        div.mdc-select.mdc-select--filled {
          --mdc-select-fill-color: var(--grey-1-color);
          box-shadow: var(--shadow-outset);
          border-radius: var(--ha-card-border-radius);
        }
  #################################
  # CARD_MOD: ha-sidebar
  #################################
  card-mod-sidebar-yaml: |
    "ha-list-item-button$": |
      :host md-item {
        overflow: visible;
      }
      :host ha-ripple {
        --md-ripple-hover-color: transparent;
        --md-ripple-pressed-color: transparent;
      }
    "ha-tooltip$":
      "wa-popup$": |
        div>slot>div.body {
          background-color: var(--grey-1-color);
          white-space: nowrap;
          box-shadow: var(--shadow-outset);
          text-align: center;
          border-radius: var(--ha-card-border-radius);
          padding: 0.25rem 0.5rem;
          position: absolute;
          z-index: 1;
          margin-bottom: 1rem;
        }
    .: |
      :host ha-list-item-button > :is(ha-svg-icon, ha-icon)[slot="start"]:hover,
      :host ha-list-item-button.selected > :is(ha-svg-icon, ha-icon)[slot="start"] {
        box-shadow: var(--shadow-button-inset);
        --icon-primary-color: var(--secondary-accent-color);
        color: var(--secondary-accent-color);
        text-shadow: 0 0 15px var(--secondary-accent-color);
      }
      :host ha-list-item-button.selected::before {
        background-color: transparent;
      }
      :host ha-list-item-button > :is(ha-svg-icon, ha-icon)[slot="start"] {
        border-radius: 50%;
        padding: 8px;
        box-shadow: var(--shadow-button-outset);
        --sidebar-icon-color: var(--primary-text-color);
      }
      :host([expanded]) ha-list-item-button .item-text {
        background: var(--black-color);
        background-clip: text;
        color: var(--primary-text-color);
        font-size: var(--ha-font-size-l);
        text-shadow: rgba(255, 255, 255, 0.25) -1px -2px 1px;
      }
      :host ha-list-item-button {
        --mdc-icon-size: 22px;
        --ha-space-6: 22px;
        --ha-space-3: 6px;
      }
      ha-list-nav>ha-list-item-button.user>ha-user-badge {
        box-shadow: var(--shadow-button-inset);
        border-radius: 50%;
      }
      ha-list-nav.ha-scrollbar.before-spacer  {
        scrollbar-width: none !important;
      }
      div.menu>div.title {
        background: var(--black-color);
        background-clip: text;
        color: var(--primary-text-color);
        text-shadow: rgba(255, 255, 255, 0.25) -1px -2px 1px;
      }
  #################################
  # CARD_MOD: ha-dialog
  #################################
  card-mod-dialog-yaml: |
    $: |
      :host(.type-add-automation-element-dialog),
      :host(.type-dialog-data-entry-flow),
      :host(.type-dialog-edit-card),
      :host(.type-dialog-restart),
      :host(.type-dialog-box) {
        --dialog-surface-margin-top: 0;
      }
      :host(.type-add-automation-element-dialog) wa-dialog::part(dialog),
      :host(.type-dialog-data-entry-flow) wa-dialog::part(dialog),
      :host(.type-dialog-edit-card) wa-dialog::part(dialog),
      :host(.type-dialog-restart) wa-dialog::part(dialog),
      :host(.type-dialog-box) wa-dialog::part(dialog) {
        --dialog-surface-position: relative;
        transition: var(--ha-dialog-transition);
      }
      :host(.type-dialog-data-entry-flow) wa-dialog::part(dialog)::backdrop,
      :host(.type-dialog-edit-card) wa-dialog::part(dialog)::backdrop,
      :host(.type-dialog-restart) wa-dialog::part(dialog)::backdrop,
      :host(.type-dialog-box) wa-dialog::part(dialog)::backdrop {
        backdrop-filter: var(--ha-dialog-scrim-backdrop-filter);
      }

      div.mdc-dialog div.mdc-dialog__surface {
        /*  Includes pop-ups that are not included with more-info such as Devices and Services install  */
        --dialog-surface-position: relative;
        border: 0;
        transition: var(--ha-dialog-transition);
      }
      .header-title {
        text-transform: uppercase;
      }
      div.mdc-dialog div.mdc-dialog__scrim {
        backdrop-filter: var(--ha-dialog-scrim-backdrop-filter);
        background-color: var(--dialog-scrim-color);
      }
      #contentSlot {
        --mdc-select-fill-color: rgba(255, 255, 255, 0.1);
        --mdc-theme-surface: rgba(30, 30, 30, 0.1);
      }
      
    ha-button:
      $: |
        :host button.button,
        :host .button,
        button.button,
        div.button {
          box-shadow: var(--shadow-button-outset);
        }
        :host([appearance~=filled]) button.button,
        :host([appearance~="accent"]) button.button,
        :host([appearance="accent"]) button.button {
          /*  Buttons on type-browser-mod-popup             */
          box-shadow: var(--shadow-button-outset);
          background-color: var(--grey-1-color);
          border: none;
        }
        :host([appearance~="accent"]) button.button:not(.disabled):not(.loading):hover,
        :host([appearance="accent"]) button.button:not(.disabled):not(.loading):hover {
          box-shadow: var(--shadow-button-inset);
          background-color: var(--grey-1-color);
          color: var(--secondary-accent-color);
          text-shadow: 0 0 15px var(--secondary-accent-color);        
        }
        :host([appearance~="accent"]) button.button:not(.disabled):not(.loading):active,
        :host([appearance="accent"]) button.button:not(.disabled):not(.loading):active {
          box-shadow: var(--shadow-button-inset);
          background-color: var(--grey-1-color);
          color: var(--secondary-accent-color);
          text-shadow: 0 0 15px var(--secondary-accent-color);        
        }
        :host([appearance~="plain"]) .button.disabled,
        :host([appearance="plain"]) .button.disabled {
          box-shadow: var(--shadow-button-inset);
          background-color: var(--grey-1-color);
          color: var(--grey-9-color);
        }
    .: |
      ha-dialog {       
        --vertical-align-dialog: center !important;                    /* Adjust dialog vertical alignment and remove default background/border for the dialog button area */
      }

  #################################
  # CARD_MOD: ha-more-info-dialog
  # Note: more-info applies styles rooted in the ha-dialog element of more-info dialogs.
  #################################
  card-mod-more-info-yaml: |
    "* $": |
      :host button.button {
        box-shadow: var(--shadow-button-outset);
      }
      :host button.button:is(.disabled) {
        box-shadow: var(--shadow-inset);
        color: var(--disabled-text-color) !important;
      }
      :host button.button:not(.disabled):not(.loading):hover {
        color: var(--primary-color) !important;
      }
      :host button.button:not(.disabled):not(.loading):active {
        box-shadow: var(--shadow-inset);
        color: var(--primary-color) !important;
      }
    ha-progress-bar:
      $: |
        div.progress-bar {
        }
    ha-more-info-info $ more-info-content $:
      more-info-light $: |
        div ha-attributes,
        div ha-more-info-light-favorite-colors,
        div ha-more-info-control-select-container {
          {# Remove the favorite colors and attributes box for a cleaner look on light more-info #}
          display: none;
        }
      "more-info-light$":
        "div.controls > ha-state-control-light-brightness $": |
          ha-control-slider {
            transform: rotate(0deg);
          }
      hui-section>hui-grid-section$: |
        :host .type-grid-section {
          display: none;
        }
    $: |
      div.mdc-dialog div.mdc-dialog__surface {
        {# Includes entity more-info such as lights and update pop-ups in Config Settings #}
        box-shadow: var(--ha-dialog-box-shadow);
        transition: var(--ha-dialog-transition);
      }
      div.mdc-dialog div.mdc-dialog__scrim {
        backdrop-filter: var(--ha-dialog-scrim-backdrop-filter);
        background-color: var(--dialog-scrim-color);
      }
    .: |
      ha-dialog {       
        --vertical-align-dialog: center !important;                    /* Adjust dialog vertical alignment and remove default background/border for the dialog button area */
        --dialog-surface-position: relative;
      }


  # # Buttons on more-info update and info pop-ups
  # ha-more-info-info $ more-info-content $ more-info-update $ ha-button $: |
  #   :host .button {
  #     min-width: 80px;
