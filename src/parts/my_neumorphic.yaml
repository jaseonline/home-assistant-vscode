  # ============================================================================
  # MODE DEFINITIONS - Light and Dark
  # ============================================================================
  modes:
    light:
      # ========================================================================
      # NEUMORPHIC DESIGN TOKENS - LIGHT MODE
      # ========================================================================

      # --- Core Neumorphic Colors ---
      # Base surface: soft gray like reference
      neumorphic-base: "#E4E8EE"
      neumorphic-base-rgb: "228, 232, 238"
      neumorphic-raised: "#E4E8EE"
      neumorphic-inset: "#D1D9E6"

      # Shadow colors for 3D effect
      neumorphic-shadow-light: "rgba(255, 255, 255, 0.8)"
      neumorphic-shadow-dark: "rgba(163, 177, 198, 0.6)"
      neumorphic-shadow-light-strong: "rgba(255, 255, 255, 0.9)"
      neumorphic-shadow-dark-strong: "rgba(163, 177, 198, 0.7)"

      # --- Text Colors ---
      primary-text-color: "#2D3142"
      secondary-text-color: "#5C6378"
      text-primary-color: "#FFFFFF"
      disabled-text-color: "#9BA3B5"
      text-light-primary-color: "#F5F5F5"

      # --- Primary Accent Colors ---
      # Sophisticated blue-slate for premium feel
      primary-color: "#4A6FA5"
      dark-primary-color: "#3A5A8A"
      light-primary-color: "#7A9FD5"
      accent-color: "#D4A574"

      # --- Background Colors ---
      view-background: "hsl(0, 0%, 90%)"
      primary-background-color: "#E4E8EE"
      secondary-background-color: "#D1D9E6"
      card-background-color: "#E4E8EE"
      divider-color: "rgba(45, 49, 66, 0.08)"

      # --- State Colors ---
      state-icon-color: "#5C6378"
      state-icon-active-color: "#4A6FA5"
      state-icon-unavailable-color: "#9BA3B5"
      state-on-color: "#4A9F6E"
      state-off-color: "#9BA3B5"

      # Success/Warning/Error
      success-color: "#4A9F6E"
      warning-color: "#D4A574"
      error-color: "#C75B5B"
      info-color: "#4A6FA5"

      # --- Card Styling ---
      ha-card-background: "linear-gradient(180deg, rgba(135, 180, 220, 0.12) 0%, rgba(135, 180, 220, 0.05) 30%, #E4E8EE 60%)"
      ha-card-border-radius: "20px"
      ha-card-border-width: "0px"
      ha-card-border-color: "transparent"
      ha-card-box-shadow: "9px 9px 16px rgba(163, 177, 198, 0.6), -9px -9px 16px rgba(255, 255, 255, 0.8)"

      # --- Header ---
      app-header-background-color: "#E4E8EE"
      app-header-text-color: "#2D3142"
      app-header-edit-background-color: "#D1D9E6"
      app-header-edit-text-color: "#2D3142"

      # --- Sidebar ---
      sidebar-background-color: "#E4E8EE"
      sidebar-text-color: "#2D3142"
      sidebar-icon-color: "#5C6378"
      sidebar-selected-background-color: "#D1D9E6"
      sidebar-selected-text-color: "#4A6FA5"
      sidebar-selected-icon-color: "#4A6FA5"
      # md-list-item-leading-space: "8px"
      # md-list-item-trailing-space: "8px"
      # md-list-item-leading-icon-size: "1.8rem"
      #app-safe-area-inset-left: "-56px"

      # --- Dialog / Modal ---
      mdc-dialog-scrim-color: "rgba(45, 49, 66, 0.3)"

      # --- Buttons / Controls ---
      mdc-button-raised-box-shadow: "5px 5px 10px rgba(163, 177, 198, 0.5), -5px -5px 10px rgba(255, 255, 255, 0.7)"

      # Sliders
      slider-color: "#4A6FA5"
      slider-bar-color: "#D1D9E6"
      slider-secondary-color: "#7A9FD5"
      control-slider-thickness: "20px"
      control-slider-background-opacity: "1"
      control-slider-background: "transparent"
      control-button-border-radius: "8px"

      # Toggles / Switches
      toggle-button-color: "#4A6FA5"
      toggle-button-unchecked-color: "#9BA3B5"
      switch-checked-color: "#4A6FA5"
      switch-unchecked-color: "#9BA3B5"
      switch-checked-track-color: "#7A9FD5"
      switch-unchecked-track-color: "#D1D9E6"

      # --- Input Fields ---
      input-fill-color: "#D1D9E6"
      input-ink-color: "#2D3142"
      input-label-ink-color: "#5C6378"
      input-idle-line-color: "transparent"
      input-hover-line-color: "#4A6FA5"
      input-disabled-fill-color: "#E4E8EE"
      input-disabled-ink-color: "#9BA3B5"

      # --- Labels / Badges ---
      label-badge-background-color: "#E4E8EE"
      label-badge-text-color: "#2D3142"
      label-badge-red: "#C75B5B"
      label-badge-green: "#4A9F6E"
      label-badge-blue: "#4A6FA5"
      label-badge-yellow: "#D4A574"
      label-badge-grey: "#9BA3B5"

      # --- Scrollbar ---
      scrollbar-thumb-color: "rgba(45, 49, 66, 0.2)"

      # --- Toast / Notifications ---
      paper-toast-background-color: "#2D3142"
      paper-toast-color: "#F5F5F5"

      # --- Code Editor ---
      code-editor-background-color: "#D1D9E6"
      codemirror-atom: "#C75B5B"
      codemirror-comment: "#9BA3B5"
      codemirror-keyword: "#4A6FA5"
      codemirror-string: "#4A9F6E"
      codemirror-number: "#D4A574"

      # --- Layout Spacing ---
      masonry-view-card-margin: "8px"
      grid-card-gap: "16px"
      stack-card-margin: "8px"
      horizontal-stack-card-margin: "0 8px"
      vertical-stack-card-margin: "8px 0"

      # --- Chip Styling ---
      chip-background-color: "#E4E8EE"
      chip-height: "40px"
      chip-padding: "2px"
      chip-text-color: "#2D3142"
      chip-icon-color: "#5C6378"
      chip-box-shadow: "5px 5px 10px rgba(163, 177, 198, 0.5), -5px -5px 10px rgba(255, 255, 255, 0.7)"

    dark:
      # ========================================================================
      # NEUMORPHIC DESIGN TOKENS - DARK MODE
      # ========================================================================

      # Under modes: > dark: — replace these values:
