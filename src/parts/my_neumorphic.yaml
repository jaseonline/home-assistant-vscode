      # --- Background Colors ---
      view-background: "var(--grey-1-color)"
      # primary-background-color: "var(--grey-1-color)"
      secondary-background-color: "hsla(0, 0%, 7%, 1)"
      # card-background-color: "var(--grey-card-color)"
      divider-color: "rgba(232, 228, 223, 0.08)"

      # --- State Colors ---
      state-icon-color: "var(--secondary-text-color)"
      # state-icon-active-color: "#6B9BD2"
      state-icon-unavailable-color: "#6A6A6E"
      # state-on-color: "#6BC78E"
      state-off-color: "#6A6A6E"
      filament-light-color: "rgb(255,142,33)"

      # Success/Warning/Error
      success-color: "#6BC78E"
      warning-color: "#E8B896"
      error-color: "#E87B7B"
      info-color: "#6B9BD2"

      # --- Card Styling ---
      #ha-card-background: "linear-gradient(180deg, rgba(107, 155, 210, 0.15) 0%, rgba(107, 155, 210, 0.06) 30%, #2A2A2E 60%)"
      # ha-card-background: "var(--grey-card-color)"
      # ha-card-border-radius: "15px"
      ha-card-border-color: "transparent"
      # ha-card-box-shadow: "var(--shadow-outset)"
      ha-card-inset-shadow: "var(--shadow-inset)"
      ha-card-backdrop-filter: "blur(2px)"
      md-list-container-color: "transparent"


      ha-progress-bar-track-color: "var(--slider-color)"
      ha-progress-bar-track-height: "0.5rem"
      ha-progress-bar-border-radius: "5px"
      ha-progress-bar-indicator-color: "#03a9f4"
      ha-progress-bar-indicator-background: "#f441a5"
      ha-progress-bar-indicator-highlight-width: "0.5rem"
      ha-progress-bar-indicator-highlight-height: "0.5rem"
      ha-progress-bar-indicator-highlight-image: "var(--slider-gradient)"

      # --- Dialog Styling ---
      ha-dialog-surface-background: "var(--grey-1-color)"
      ha-dialog-box-shadow: "0.857rem 0.857rem 1.714rem -0.143rem hsl(0,0%,5%), -0.857rem -0.857rem 1.714rem -0.143rem hsla(0,0%,25%,0.85)"
      dialog-box-shadow: "0.857rem 0.857rem 1.714rem -0.143rem hsl(0,0%,5%), -0.857rem -0.857rem 1.714rem -0.143rem hsla(0,0%,25%,0.85)"
      dialog-scroll-divider-color: "transparent"
      # ha-dialog-surface-backdrop-filter: "blur(4px)" # causes issues with some drop downs
      # dialog-container-padding: "1rem"

      # --- Header ---
      app-header-background-color: "transparent"
      app-header-text-color: "var(--primary-text-color)"
      app-header-edit-background-color: "var(--grey-4-color)"
      app-header-edit-text-color: "var(--primary-text-color)"
      app-header-backdrop-filter: "none"
      app-header-border-bottom: "0"

      # --- Sidebar ---
      sidebar-background-color: "var(--grey-1-color)"
      sidebar-text-color: "var(--primary-text-color)"
      sidebar-icon-color: "var(--primary-text-color)"
      # ha-ripple-color: "transparent"
      # ha-ripple-pressed-color: "transparent"
      # ha-ripple-hover-color: "transparent"
      # custom-sidebar-selection-background: "transparent"
      # custom-sidebar-selection-opacity: "0"
      sidebar-selected-icon-color: "var(--secondary-accent-color)"
      sidebar-selected-text-color: "var(--primary-text-color)"
      # sidebar-selected-background-color: "#222226"
      # sidebar-selected-text-color: "#6B9BD2"
      # sidebar-selected-icon-color: "#6B9BD2"

      # --- Dialog / Modal ---
      mdc-dialog-scrim-color: "var(--dialog-scrim-color)"
      wa-color-overlay-modal: "var(--dialog-scrim-color)"

      # --- Buttons / Controls ---
      mdc-button-raised-box-shadow: "0.3rem 0.3rem 0.5rem var(--black-color), -0.2rem -0.2rem 0.4rem var(--grey-3-color)"

      wa-color-fill-loud: "var(--accent-color)"
      button-color-fill-normal-active: "var(--grey-1-color)"
      button-color-fill-normal-hover: "var(--grey-1-color)"
      button-color-fill-loud-active: "var(--grey-1-color)"
      button-color-fill-loud-hover: "var(--grey-1-color)"

      wa-color-brand-fill-loud: "var(--accent-color)"
      wa-color-brand-fill-normal: "var(--grey-1-color)"
      wa-color-brand-fill-quiet: "var(--grey-1-color)"
      wa-color-brand-border-loud: "var(--grey-1-color)"
      wa-color-brand-border-normal: "var(--grey-1-color)"
      wa-color-brand-border-quiet: "var(--grey-1-color)"
      wa-color-brand-on-loud: "var(--primary-text-color)"
      wa-color-brand-on-normal: "var(--primary-text-color)"
      wa-color-brand-on-quiet: "var(--primary-text-color)"
      ha-color-fill-primary-normal-active: "var(--grey-1-color)"
      ha-color-fill-primary-normal-hover: "var(--grey-1-color)"
      ha-color-fill-primary-loud-active: "var(--grey-1-color)"
      ha-color-fill-primary-loud-hover: "var(--grey-1-color)"
      ha-color-fill-disabled-loud-resting: "var(--grey-1-color)"
      ha-color-fill-disabled-normal-resting: "var(--grey-1-color)"
      ha-color-fill-disabled-quiet-resting: "var(--grey-1-color)"

      # Sliders
      # slider-color: "#6B9BD2"
      # slider-bar-color: "#222226"
      # slider-secondary-color: "#8BB5E8"
      slider-gradient: "linear-gradient(to right, #03a9f4 25%, #f441a5 100%)"

      # Toggles / Switches
      toggle-button-unchecked-color: "#6A6A6E"
      # toggle-button-color: "#6B9BD2"
      # switch-checked-color: "#6B9BD2"
      # switch-unchecked-color: "#6A6A6E"
      # switch-checked-track-color: "#8BB5E8"
      # switch-unchecked-track-color: "#222226"

      # --- Input Fields ---
      # input-fill-color: "var(--grey-2-color)"
      input-ink-color: "#E8E4DF"
      input-label-ink-color: "#A8A4A0"
      input-idle-line-color: "transparent"
      # input-hover-line-color: "#6B9BD2"
      input-disabled-fill-color: "var(--grey-1-color)"
      input-disabled-ink-color: "#6A6A6E"
      mdc-text-field-fill-color: "hsla(0, 0%, 5%, 1)"
      mdc-text-field-disabled-fill-color: "hsla(0, 0%, 5%, .6)"
      mdc-select-fill-color: "hsla(0, 0%, 0%, 1)"
      mdc-select-disabled-fill-color: "hsla(0, 0%, 0%, 1)"

      ha-tooltip-box-shadow: "0.3rem 0.3rem 0.5rem black, -0.2rem -0.2rem 0.4rem rgba(51, 51, 51, 0.9)"

      # --- Labels / Badges ---
      label-badge-background-color: "#2A2A2E"
      label-badge-text-color: "#E8E4DF"
      label-badge-red: "#E87B7B"
      label-badge-green: "#6BC78E"
      label-badge-blue: "#6B9BD2"
      label-badge-yellow: "#E8B896"
      label-badge-grey: "#6A6A6E"

      # --- Scrollbar ---
      scrollbar-thumb-color: "rgba(232, 228, 223, 0.15)"

      # --- Toast / Notifications ---
      paper-toast-background-color: "#E8E4DF"
      paper-toast-color: "#2A2A2E"


      # --- Chip Styling ---
      # chip-background-color: "#222226"
      # chip-text-color: "#E8E4DF"
      # chip-icon-color: "#A8A4A0"
      chip-box-shadow: "var(--shadow-outset)"

